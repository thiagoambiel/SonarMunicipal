<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><rect width="1400" height="860" fill="#f3f7fb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e6b9b"/></marker></defs><text x="80" y="82" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#17324a">Pipeline do Sonar Municipal</text><text x="80" y="116" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Fluxo da descoberta de fontes à consulta pública de políticas similares</text><rect x="96" y="190" width="340" height="126" rx="24" fill="#cfdae5" opacity="0.35"/><rect x="90" y="180" width="340" height="126" rx="24" fill="#fbfdff" stroke="#254761" stroke-width="3"/><text x="260.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#17324a">1. Descoberta</text><text x="260.0" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Municípios do IBGE</text><text x="260.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">+ heurísticas de URL</text><rect x="536" y="190" width="340" height="126" rx="24" fill="#cfdae5" opacity="0.35"/><rect x="530" y="180" width="340" height="126" rx="24" fill="#fbfdff" stroke="#254761" stroke-width="3"/><text x="700.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#17324a">2. Extração</text><text x="700.0" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Instâncias SAPL válidas</text><text x="700.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">+ PLs públicos</text><rect x="976" y="190" width="340" height="126" rx="24" fill="#cfdae5" opacity="0.35"/><rect x="970" y="180" width="340" height="126" rx="24" fill="#dbe8f4" stroke="#254761" stroke-width="3"/><text x="1140.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#2e6b9b">3. Textualização</text><text x="1140.0" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Ementas jurídicas</text><text x="1140.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">→ ações textualizadas</text><rect x="316" y="420" width="340" height="126" rx="24" fill="#cfdae5" opacity="0.35"/><rect x="310" y="410" width="340" height="126" rx="24" fill="#fbfdff" stroke="#254761" stroke-width="3"/><text x="480.0" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#17324a">4. Busca semântica</text><text x="480.0" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Embeddings E5</text><text x="480.0" y="516" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">+ índice no Qdrant</text><rect x="756" y="420" width="340" height="126" rx="24" fill="#cfdae5" opacity="0.35"/><rect x="750" y="410" width="340" height="126" rx="24" fill="#fbfdff" stroke="#254761" stroke-width="3"/><text x="920.0" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#17324a">5. Análise</text><text x="920.0" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Agrupamento textual</text><text x="920.0" y="516" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">+ indicadores</text><line x1="430" y1="243" x2="505" y2="243" stroke="#2e6b9b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="870" y1="243" x2="945" y2="243" stroke="#2e6b9b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1140 306 L 1140 360 L 480 360 L 480 402" fill="none" stroke="#2e6b9b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="650" y1="473" x2="725" y2="473" stroke="#2e6b9b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 920 536 L 920 600 L 700 600 L 700 640" fill="none" stroke="#2e6b9b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="306" y="660" width="800" height="126" rx="24" fill="#cfdae5" opacity="0.35"/><rect x="300" y="650" width="800" height="126" rx="24" fill="#e7f1f9" stroke="#254761" stroke-width="3"/><text x="700.0" y="690" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#4f88b4">Interface pública</text><text x="700.0" y="732" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">Consulta por problema, exploração de políticas similares</text><text x="700.0" y="756" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#5d7389">e inspeção do pipeline em uma única aplicação web</text><text x="80" y="816" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#5d7389">Entrada: municípios brasileiros e portais legislativos heterogêneos</text><text x="80" y="844" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#5d7389">Saída: infraestrutura reprodutível para busca, agrupamento e apoio exploratório à formulação de políticas</text></svg>