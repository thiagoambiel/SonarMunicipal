<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6f2e8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d3622b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d6a"/></marker></defs><text x="90" y="82" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1d2a3a">Pipeline do Sonar Municipal</text><text x="90" y="120" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Fluxo da descoberta de fontes à consulta pública de políticas similares</text><rect x="90" y="150" width="250" height="118" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="215.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#1d2a3a">1. Descoberta</text><text x="215.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Municípios do IBGE</text><text x="215.0" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">+ heurísticas de URL</text><rect x="390" y="150" width="250" height="118" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="515.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#1d2a3a">2. Extração</text><text x="515.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Instâncias SAPL válidas</text><text x="515.0" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">+ PLs públicos</text><rect x="690" y="150" width="250" height="118" rx="24" fill="#f2d6c8" stroke="#213547" stroke-width="3"/><text x="815.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#d3622b">3. Textualização</text><text x="815.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Ementas jurídicas</text><text x="815.0" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">→ ações textualizadas</text><rect x="990" y="150" width="250" height="118" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="1115.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#1d2a3a">4. Busca semântica</text><text x="1115.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Embeddings E5</text><text x="1115.0" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">+ índice no Qdrant</text><rect x="1290" y="150" width="220" height="118" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="1400.0" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#1d2a3a">5. Análise</text><text x="1400.0" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Agrupamento</text><text x="1400.0" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">+ indicadores</text><line x1="354" y1="209" x2="376" y2="209" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="654" y1="209" x2="676" y2="209" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="954" y1="209" x2="976" y2="209" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1254" y1="209" x2="1276" y2="209" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1400 280 C 1450 360, 1320 470, 1120 570" fill="none" stroke="#2f7d6a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="460" y="570" width="680" height="150" rx="24" fill="#eef6f3" stroke="#213547" stroke-width="3"/><text x="800.0" y="612" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" fill="#2f7d6a">Interface pública</text><text x="800.0" y="654" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">Consulta por problema, exploração de políticas similares</text><text x="800.0" y="678" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#61738a">e inspeção do pipeline em uma única aplicação web</text><text x="110" y="820" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Entrada: municípios brasileiros e portais legislativos heterogêneos</text><text x="110" y="852" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Saída: infraestrutura reprodutível para busca, agrupamento e apoio exploratório à formulação de políticas</text></svg>