<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><rect width="1400" height="860" fill="#f6f2e8"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d3622b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d6a"/></marker></defs><text x="80" y="82" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#1d2a3a">Pipeline do Sonar Municipal</text><text x="80" y="116" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Fluxo da descoberta de fontes à consulta pública de políticas similares</text><rect x="96" y="190" width="340" height="126" rx="24" fill="#d9d1c2" opacity="0.25"/><rect x="90" y="180" width="340" height="126" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="260.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#1d2a3a">1. Descoberta</text><text x="260.0" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Municípios do IBGE</text><text x="260.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">+ heurísticas de URL</text><rect x="536" y="190" width="340" height="126" rx="24" fill="#d9d1c2" opacity="0.25"/><rect x="530" y="180" width="340" height="126" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="700.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#1d2a3a">2. Extração</text><text x="700.0" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Instâncias SAPL válidas</text><text x="700.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">+ PLs públicos</text><rect x="976" y="190" width="340" height="126" rx="24" fill="#d9d1c2" opacity="0.25"/><rect x="970" y="180" width="340" height="126" rx="24" fill="#f2d6c8" stroke="#213547" stroke-width="3"/><text x="1140.0" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#d3622b">3. Textualização</text><text x="1140.0" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Ementas jurídicas</text><text x="1140.0" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">→ ações textualizadas</text><rect x="316" y="420" width="340" height="126" rx="24" fill="#d9d1c2" opacity="0.25"/><rect x="310" y="410" width="340" height="126" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="480.0" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#1d2a3a">4. Busca semântica</text><text x="480.0" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Embeddings E5</text><text x="480.0" y="516" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">+ índice no Qdrant</text><rect x="756" y="420" width="340" height="126" rx="24" fill="#d9d1c2" opacity="0.25"/><rect x="750" y="410" width="340" height="126" rx="24" fill="#fffdf8" stroke="#213547" stroke-width="3"/><text x="920.0" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#1d2a3a">5. Análise</text><text x="920.0" y="492" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Agrupamento textual</text><text x="920.0" y="516" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">+ indicadores</text><line x1="430" y1="243" x2="510" y2="243" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="870" y1="243" x2="950" y2="243" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1140 306 C 1160 360, 1110 400, 1040 430" fill="none" stroke="#2f7d6a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/><path d="M 260 306 C 240 360, 290 400, 360 430" fill="none" stroke="#2f7d6a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/><line x1="650" y1="473" x2="730" y2="473" stroke="#d3622b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 530 536 C 530 585, 580 620, 700 650" fill="none" stroke="#2f7d6a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/><path d="M 870 536 C 870 585, 820 620, 700 650" fill="none" stroke="#2f7d6a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="306" y="660" width="800" height="126" rx="24" fill="#d9d1c2" opacity="0.25"/><rect x="300" y="650" width="800" height="126" rx="24" fill="#eef6f3" stroke="#213547" stroke-width="3"/><text x="700.0" y="690" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="28" fill="#2f7d6a">Interface pública</text><text x="700.0" y="732" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">Consulta por problema, exploração de políticas similares</text><text x="700.0" y="756" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#61738a">e inspeção do pipeline em uma única aplicação web</text><text x="80" y="816" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#61738a">Entrada: municípios brasileiros e portais legislativos heterogêneos</text><text x="80" y="844" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#61738a">Saída: infraestrutura reprodutível para busca, agrupamento e apoio exploratório à formulação de políticas</text></svg>